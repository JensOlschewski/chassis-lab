# Shared test fixture: SVC simulation mapping for the 24 canonical
# WHEEL_LOADS + GEOMETRY signals. Used by multiple clab-cli integration
# tests that only need "some valid SVC mapping" and don't care about
# examples/ internals — entity/component names match the synthetic SVC
# inputs those tests build (`example.wheel_loads`, `example.geometry`,
# `example.ride_heights`, `example.toe_camber`). `measurement.svc` is a
# single unused placeholder: `function_svc` always requires a non-empty
# measurement mapping too, even for a simulation-only run that never
# consults it.

[mappings.simulation.svc.front_left_wheel_load]
entity = "example.wheel_loads"
component = "front_left"
unit = "newton"
[mappings.simulation.svc.front_right_wheel_load]
entity = "example.wheel_loads"
component = "front_right"
unit = "newton"
[mappings.simulation.svc.rear_left_wheel_load]
entity = "example.wheel_loads"
component = "rear_left"
unit = "newton"
[mappings.simulation.svc.rear_right_wheel_load]
entity = "example.wheel_loads"
component = "rear_right"
unit = "newton"
[mappings.simulation.svc.wheelbase]
entity = "example.geometry"
component = "wheelbase"
unit = "mm"
[mappings.simulation.svc.front_left_ride_height]
entity = "example.ride_heights"
component = "front_left"
unit = "mm"
[mappings.simulation.svc.front_right_ride_height]
entity = "example.ride_heights"
component = "front_right"
unit = "mm"
[mappings.simulation.svc.rear_left_ride_height]
