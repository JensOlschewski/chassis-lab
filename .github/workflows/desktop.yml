name: Desktop

on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            script: bundle:linux
            artifact: target/release/bundle/deb/*.deb
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            script: bundle:windows
            artifact: target/release/bundle/nsis/*.exe
          - os: macos-26-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
            script: bundle:macos
            artifact: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/clab-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-desktop-${{ hashFiles('**/Cargo.lock', '.github/workflows/desktop.yml', 'packaging/*') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-desktop-

      - name: Install Rust build tools
        run: python -m pip install "cmake>=3.26,<4"

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select Windows CMake generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV 'CMAKE_GENERATOR=Ninja'

      - name: Build Linux embedded runtime
        if: runner.os == 'Linux'
        run: packaging/build-embedded-runtime.sh dist/embed-bundle-linux-x86_64

      - name: Build Windows embedded runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\packaging\build-embedded-runtime-windows.ps1 dist\embed-bundle-windows-x86_64

      - name: Build Intel macOS embedded runtime
        if: runner.os == 'macOS'
        run: packaging/build-embedded-runtime-macos.sh dist/embed-bundle-macos-x86_64

      - name: Install frontend dependencies
        working-directory: crates/clab-app
        run: npm ci

      - name: Build desktop bundle
        working-directory: crates/clab-app
        run: npm run ${{ matrix.script }}

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
