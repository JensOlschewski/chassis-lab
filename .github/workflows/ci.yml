name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: py-chassislab/pyproject.toml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust quality build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality

      - name: Install Rust build tools
        run: python -m pip install "cmake>=3.26,<4"

      - name: Install Python package
        run: python -m pip install "./py-chassislab[dev]"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Check Python
        run: cd py-chassislab && ruff check . && ruff format --check .

      - name: Test Python and integration
        run: cd py-chassislab && pytest -q

  linux-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Linux runtime build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-runtime
          key: ${{ hashFiles('packaging/embedded-runtime-linux-x86_64.lock', 'packaging/build-embedded-runtime.sh') }}

      - name: Install Rust build tools
        run: python3 -m pip install "cmake>=3.26,<4"

      - name: Build Linux runtime archive
        run: packaging/build-embedded-runtime.sh dist/clab-runtime-linux-x86_64

      - name: Verify Linux runtime checksum
        run: sha256sum --check dist/clab-runtime-linux-x86_64.tar.gz.sha256

      - name: Smoke test Linux runtime in clean Ubuntu container
        run: |
          smoke_input="$(mktemp)"
          trap 'rm -f "$smoke_input"' EXIT
          tar -czf "$smoke_input" \
            dist/clab-runtime-linux-x86_64.tar.gz \
            examples/config.toml \
            examples/input/run-simulation.toml \
            examples/setup.toml \
            examples/mappings-simulation.toml \
            examples/mappings-measurement.toml \
            examples/tolerances.toml \
            examples/input/raw-simulation/example-simulation-svc.res \
            examples/input/raw-simulation/example-simulation-knc-vertical.res \
            examples/input/raw-simulation/example-simulation-knc-static.res \
            examples/input/raw-simulation/example-simulation-knc-roll.res \
            examples/input/raw-measurement/example-measurement-knc-vertical.acd
          test -s "$smoke_input"
          docker run --rm --pull=missing -i \
            ubuntu:24.04 \
            bash -ceu '
              mkdir /tmp/input /tmp/clab-runtime /tmp/smoke
              tar -xzf - -C /tmp/input
              tar -xzf /tmp/input/dist/clab-runtime-linux-x86_64.tar.gz -C /tmp/clab-runtime
              bundle=/tmp/clab-runtime/clab-runtime-linux-x86_64
              cp /tmp/input/examples/config.toml /tmp/smoke/
              cp /tmp/input/examples/setup.toml /tmp/input/examples/mappings-simulation.toml /tmp/input/examples/mappings-measurement.toml /tmp/input/examples/tolerances.toml /tmp/smoke/
              mkdir /tmp/smoke/input
              cp /tmp/input/examples/input/run-simulation.toml /tmp/smoke/input/
              cp /tmp/input/examples/input/raw-simulation/example-simulation-svc.res /tmp/smoke/
              cp /tmp/input/examples/input/raw-simulation/example-simulation-knc-vertical.res /tmp/smoke/
              cp /tmp/input/examples/input/raw-simulation/example-simulation-knc-static.res /tmp/smoke/
              cp /tmp/input/examples/input/raw-simulation/example-simulation-knc-roll.res /tmp/smoke/
              cp /tmp/input/examples/input/raw-measurement/example-measurement-knc-vertical.acd /tmp/smoke/
              cd /tmp/smoke
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" --version
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" convert example-simulation-svc.res -d svc -o input/generated-simulation-svc.h5
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" convert example-simulation-knc-vertical.res -d knc -t vertical -o input/generated-simulation-knc-vertical.h5
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" convert example-simulation-knc-static.res -d knc -t static -o input/generated-simulation-knc-static.h5
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" convert example-simulation-knc-roll.res -d knc -t roll -o input/generated-simulation-knc-roll.h5
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" convert example-measurement-knc-vertical.acd -d knc -t vertical -o input/generated-measurement-knc-vertical.h5
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" analyze config.toml input/run-simulation.toml -r reports
              test -s reports/report.json
              test -s reports/metrics.csv
              test -s reports/svc.json
              test -s reports/knc-vertical.json
              test -s reports/knc-roll.json
            ' < "$smoke_input"
