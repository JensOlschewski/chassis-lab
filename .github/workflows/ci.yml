name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust quality build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-quality-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-quality-cargo-

      - name: Install Rust build tools
        run: python -m pip install "cmake>=3.26,<4"

      - name: Install Python package
        run: python -m pip install "./py-chassislab[dev]"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Build repository converter
        run: cargo build --workspace --release --locked

      - name: Check Python
        run: cd py-chassislab && ruff check . && ruff format --check .

      - name: Test Python and integration
        run: cd py-chassislab && pytest -q

  linux-runtime:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Linux runtime build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-linux-runtime-cargo-${{ hashFiles('**/Cargo.lock', 'packaging/embedded-runtime-linux-x86_64.lock', 'packaging/build-embedded-runtime.sh', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-linux-runtime-cargo-

      - name: Install Rust build tools
        run: python3 -m pip install "cmake>=3.26,<4"

      - name: Build Linux runtime archive
        run: packaging/build-embedded-runtime.sh dist/clab-runtime-linux-x86_64

      - name: Verify Linux runtime checksum
        run: sha256sum --check dist/clab-runtime-linux-x86_64.tar.gz.sha256

      - name: Smoke test Linux runtime in clean Ubuntu container
        run: |
          smoke_input="$(mktemp)"
          trap 'rm -f "$smoke_input"' EXIT
          tar -czf "$smoke_input" \
            dist/clab-runtime-linux-x86_64.tar.gz \
            crates/clab-converter/examples/example-svc.res \
            crates/clab-converter/examples/example-vertical.res \
            crates/clab-converter/examples/runtime-vertical.acd \
            examples/runtime-smoke.toml \
            examples/example-signals.toml \
            examples/example-measures.json
          test -s "$smoke_input"
          docker run --rm --pull=missing -i \
            ubuntu:24.04 \
            bash -ceu '
              mkdir /tmp/input /tmp/clab-runtime /tmp/smoke
              tar -xzf - -C /tmp/input
              tar -xzf /tmp/input/dist/clab-runtime-linux-x86_64.tar.gz -C /tmp/clab-runtime
              bundle=/tmp/clab-runtime/clab-runtime-linux-x86_64
              cp /tmp/input/crates/clab-converter/examples/example-svc.res /tmp/smoke/
              cp /tmp/input/crates/clab-converter/examples/example-vertical.res /tmp/smoke/
              cp /tmp/input/crates/clab-converter/examples/runtime-vertical.acd /tmp/smoke/
              cp /tmp/input/examples/runtime-smoke.toml /tmp/smoke/
              cp /tmp/input/examples/example-signals.toml /tmp/smoke/
              cp /tmp/input/examples/example-measures.json /tmp/smoke/
              cd /tmp/smoke
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" --version
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/embed-smoke" /tmp/embed-smoke.svg
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" convert example-svc.res -o svc.simulation.h5
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" convert example-vertical.res -o vertical.simulation.h5
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" convert runtime-vertical.acd -o vertical.measurement.h5
              env -i PATH="$bundle/bin:/usr/bin:/bin" PYTHONHOME=/poisoned PYTHONPATH=/poisoned VIRTUAL_ENV=/poisoned LD_LIBRARY_PATH=/poisoned "$bundle/bin/clab" validate runtime-smoke.toml --output-dir reports
              test -s reports/svc.json
              test -s reports/svc.csv
              test -s reports/knc-vertical.json
              test -s reports/knc-vertical.csv
              test -s reports/knc-vertical.svg
            ' < "$smoke_input"

      - name: Upload Linux runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-clab-runtime
          path: |
            dist/clab-runtime-linux-x86_64.tar.gz
            dist/clab-runtime-linux-x86_64.tar.gz.sha256

  windows-runtime:
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Rust runtime build
        uses: actions/cache@v6
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-windows-runtime-cargo-${{ hashFiles('**/Cargo.lock', 'packaging/embedded-runtime-windows-x86_64.lock', 'packaging/build-embedded-runtime-windows.ps1', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-windows-runtime-cargo-

      - name: Install Rust build tools
        run: python -m pip install "cmake>=3.26,<4"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select Windows CMake generator
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV 'CMAKE_GENERATOR=Ninja'

      - name: Build Windows runtime archive
        shell: pwsh
        run: .\packaging\build-embedded-runtime-windows.ps1 dist\embed-bundle-windows-x86_64

      - name: Verify Windows runtime checksum
        shell: pwsh
        run: |
          $expected = (Get-Content dist\embed-bundle-windows-x86_64.zip.sha256).Split()[0]
          $actual = (Get-FileHash dist\embed-bundle-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Windows archive checksum mismatch" }

      - name: Smoke test Windows runtime from clean extraction
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "clab-windows-smoke"
          Remove-Item $smoke -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive dist\embed-bundle-windows-x86_64.zip -DestinationPath $smoke
          $bundle = Join-Path $smoke "embed-bundle-windows-x86_64"
          $env:Path = "$(Join-Path $bundle 'bin');$env:SystemRoot\System32;$env:SystemRoot"
          $env:PYTHONHOME = "C:\poisoned"
          $env:PYTHONPATH = "C:\poisoned"
          $env:VIRTUAL_ENV = "C:\poisoned"
          & (Join-Path $bundle "bin\clab.exe") --version
          & (Join-Path $bundle "bin\embed-smoke.exe") (Join-Path $env:RUNNER_TEMP "embed-smoke.svg")
          Copy-Item crates\clab-converter\examples\example-svc.res $smoke
          Copy-Item crates\clab-converter\examples\example-vertical.res $smoke
          Copy-Item crates\clab-converter\examples\runtime-vertical.acd $smoke
          Copy-Item examples\runtime-smoke.toml $smoke
          Copy-Item examples\example-signals.toml $smoke
          Copy-Item examples\example-measures.json $smoke
          Push-Location $smoke
          & (Join-Path $bundle "bin\clab.exe") convert example-svc.res -o svc.simulation.h5
          & (Join-Path $bundle "bin\clab.exe") convert example-vertical.res -o vertical.simulation.h5
          & (Join-Path $bundle "bin\clab.exe") convert runtime-vertical.acd -o vertical.measurement.h5
          & (Join-Path $bundle "bin\clab.exe") validate runtime-smoke.toml --output-dir reports
          if (-not (Test-Path reports\svc.json)) { throw "missing SVC JSON report" }
          if (-not (Test-Path reports\knc-vertical.json)) { throw "missing vertical JSON report" }
          Pop-Location

      - name: Upload Windows runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-clab-runtime
          path: |
            dist/embed-bundle-windows-x86_64.zip
            dist/embed-bundle-windows-x86_64.zip.sha256
