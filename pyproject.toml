[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knc-validation"
version = "0.1.0"
description = "Validate Adams/Car KnC simulations against physical measurements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.11,<4",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
knc = "knc_validation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knc_validation"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
