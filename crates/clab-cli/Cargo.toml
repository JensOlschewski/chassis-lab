[package]
name = "clab-cli"
version.workspace = true
edition = "2024"

[[bin]]
name = "clab"
path = "src/main.rs"

[dependencies]
clab-converter = { path = "../clab-converter" }
anyhow = "1.0"
csv = "1.3"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clab-core = { path = "../clab-core" }
pyo3 = { version = "0.26", features = ["auto-initialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
toml = "0.9"

[dev-dependencies]
hdf5 = { package = "hdf5-metno", version = "0.13", features = ["static"] }
tempfile = "3.20"
