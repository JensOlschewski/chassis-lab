[package]
name = "adams-res-converter"
version.workspace = true
edition = "2024"

[[bin]]
name = "adams-res"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
hdf5 = { package = "hdf5-metno", version = "0.13", features = ["static"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
pyo3 = { version = "0.26", default-features = false }
tempfile = "3.20"
