[package]
name = "clab-converter"
version.workspace = true
edition = "2024"

[[bin]]
name = "adams-res"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
hdf5 = { package = "hdf5-metno", version = "0.13", features = ["static"] }
thiserror = "2.0"
tempfile = "3.20"

[dev-dependencies]
pyo3 = { version = "0.26", default-features = false }
clab-core = { path = "../clab-core" }
