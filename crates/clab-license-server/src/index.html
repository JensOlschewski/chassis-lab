<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clab license server</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 28rem; margin: 4rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem 1rem; }
  dt { color: #666; }
  dd { margin: 0; }
  .ok { color: #1a7f37; }
  .bad { color: #cf222e; }
</style>
</head>
<body>
<h1>clab license server</h1>
<dl>
  <dt>Server</dt><dd class="ok">running</dd>
  <dt>Database</dt><dd class="{{database_class}}">{{database}}</dd>
  <dt>New installations</dt><dd>{{registration}}</dd>
  <dt>Version</dt><dd>{{version}}</dd>
</dl>
</body>
</html>
