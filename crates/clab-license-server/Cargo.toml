[package]
name = "clab-license-server"
version.workspace = true
edition = "2024"

[[bin]]
name = "clab-license-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
base64 = "0.23.1"
clab-license = { path = "../clab-license" }
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
