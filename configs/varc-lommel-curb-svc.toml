[case]
name = "varc-lommel-curb-svc"
domain = "svc"
variant = "VARC"
loadcase = "CURB"

[inputs]
simulation_hdf5 = "../artifacts/varc-lommel-curb-svc/result.h5"

[physics]
gravity = 9.80665

[validation]
reference = "../measures/svc/varc-curb-lommel-measures.json"

[validation.tolerances.absolute]
front_left_mass_kg = 10.0
front_right_mass_kg = 10.0
rear_left_mass_kg = 10.0
rear_right_mass_kg = 10.0

front_mass_kg = 15.0
rear_mass_kg = 15.0
total_mass_kg = 20.0

# Percentage points, not relative percentages.
front_distribution_percent = 1.0
rear_distribution_percent = 1.0

wheelbase_mm = 5.0
front_track_mm = 10.0
rear_track_mm = 10.0

cg_x_from_front_axle_mm = 20.0
cg_height_mm = 15.0

ride_height_front_left_mm = 2.0
ride_height_front_right_mm = 2.0
ride_height_rear_left_mm = 2.0
ride_height_rear_right_mm = 2.0

[validation.tolerances.relative_percent]
front_left_mass_kg = 2.0
front_right_mass_kg = 2.0
rear_left_mass_kg = 2.0
rear_right_mass_kg = 2.0

front_mass_kg = 1.5
rear_mass_kg = 1.5
total_mass_kg = 1.0

cg_x_from_front_axle_mm = 1.0
cg_height_mm = 3.0

inertia_xx_kg_mm2 = 5.0
inertia_yy_kg_mm2 = 5.0
inertia_zz_kg_mm2 = 5.0
