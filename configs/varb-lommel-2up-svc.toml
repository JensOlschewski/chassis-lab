[case]
name = "varb-lommel-2up-svc"
domain = "svc"
variant = "VARB"
loadcase = "2UP"

[inputs]
# Relative paths are resolved against this file; absolute paths are used as-is.
simulation_hdf5 = "../artifacts/varb-lommel-2up-svc/result.h5"

[physics]
gravity = 9.80665 # m/s^2

[signals]
# Wheel loads from wheel/tire forces (newton). Rear axes share the front
# entity's source path, so they are pinned to their explicit /results groups.
front_left_wheel_load = { entity = "til_wheel_tire_forces", component = "normal_front", unit = "newton" }
front_right_wheel_load = { entity = "tir_wheel_tire_forces", component = "normal_front", unit = "newton" }
rear_left_wheel_load = { entity = "/results/til_wheel_tire_forces_2", component = "normal_rear", unit = "newton" }
rear_right_wheel_load = { entity = "/results/tir_wheel_tire_forces_2", component = "normal_rear", unit = "newton" }

# Ride heights (mm)
front_left_ride_height = { entity = "ride_heights", component = "ride_height_front_left", unit = "mm" }
front_right_ride_height = { entity = "ride_heights", component = "ride_height_front_right", unit = "mm" }
rear_left_ride_height = { entity = "ride_heights", component = "ride_height_rear_left", unit = "mm" }
rear_right_ride_height = { entity = "ride_heights", component = "ride_height_rear_right", unit = "mm" }

# Static geometry and inertia (svc_output; values are scalar results)
wheelbase = { entity = "svc_output", component = "Wheelbase", unit = "mm" }
front_track = { entity = "svc_output", component = "front_track", unit = "mm" }
rear_track = { entity = "svc_output", component = "rear_track", unit = "mm" }
cg_height = { entity = "svc_output", component = "CG_height", unit = "mm" }
inertia_xx = { entity = "svc_output", component = "IXX", unit = "kg*mm^2" }
inertia_yy = { entity = "svc_output", component = "IYY", unit = "kg*mm^2" }
inertia_zz = { entity = "svc_output", component = "IZZ", unit = "kg*mm^2" }

# Gyro x-position for the longitudinal CG calculation (mm)
gyro_x = { entity = "testrig.ges_gyro", component = "X", unit = "mm" }
