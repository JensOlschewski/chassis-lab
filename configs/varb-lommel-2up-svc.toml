[case]
name = "varb-lommel-2up-svc"
domain = "svc"
variant = "VARB"
loadcase = "2UP"

[inputs]
# Relative paths are resolved against this file; absolute paths are used as-is.
simulation_hdf5 = "../artifacts/varb-lommel-2up-svc/result.h5"

[physics]
gravity = 9.80665 # m/s^2

# SVC uses shared canonical signal mapping from chassis_lab.svc.

[validation]
reference = "../measures/svc/varb-2up-lommel-measures.json"

[validation.tolerances.absolute]
front_left_mass_kg = 10.0
front_right_mass_kg = 10.0
rear_left_mass_kg = 10.0
rear_right_mass_kg = 10.0
front_mass_kg = 15.0
rear_mass_kg = 15.0
total_mass_kg = 20.0
front_distribution_percent = 1.0
rear_distribution_percent = 1.0
wheelbase_mm = 5.0
front_track_mm = 10.0
rear_track_mm = 10.0
cg_x_from_front_axle_mm = 20.0

[validation.tolerances.relative_percent]
front_left_mass_kg = 2.0
front_right_mass_kg = 2.0
rear_left_mass_kg = 2.0
rear_right_mass_kg = 2.0
front_mass_kg = 1.5
rear_mass_kg = 1.5
total_mass_kg = 1.0
cg_x_from_front_axle_mm = 1.0
