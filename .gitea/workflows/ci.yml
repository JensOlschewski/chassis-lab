name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust build tools
        run: python -m pip install "cmake>=3.26,<4"

      - name: Install Python package
        run: python -m pip install ".[dev]"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Build repository converter
        run: cargo build --workspace --release --locked

      - name: Check Python
        run: ruff check . && ruff format --check .

      - name: Test Python and integration
        run: pytest -q

  bundle-runtime:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust build tools
        run: python3 -m pip install "cmake>=3.26,<4"

      - name: Build bundled runtime
        run: packaging/build-embedded-runtime.sh dist/embed-bundle-linux-x86_64

      - name: Verify bundle checksum
        run: sha256sum --check dist/embed-bundle-linux-x86_64.tar.gz.sha256

      - name: Smoke test in clean Ubuntu container
        run: |
          docker run --rm --pull=missing -i \
            ubuntu:24.04 \
            bash -ceu '
              mkdir /tmp/embed-bundle
              tar -xzf - -C /tmp/embed-bundle
              bundle=/tmp/embed-bundle/embed-bundle-linux-x86_64
              env -i \
                PATH="$bundle/bin:/usr/bin:/bin" \
                PYTHONHOME=/poisoned \
                PYTHONPATH=/poisoned \
                VIRTUAL_ENV=/poisoned \
                LD_LIBRARY_PATH=/poisoned \
                "$bundle/bin/embed-smoke" /tmp/embed-smoke.svg
            ' < dist/embed-bundle-linux-x86_64.tar.gz

      - name: Upload experimental bundle
        uses: actions/upload-artifact@v3
        with:
          name: embed-bundle-linux-x86_64
          path: dist/embed-bundle-linux-x86_64.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, bundle-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust build tools
        run: python -m pip install "cmake>=3.26,<4"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", tag):
              print(f"invalid release tag: {tag}", file=sys.stderr)
              raise SystemExit(1)

          expected = tag[1:]
          python_version = re.search(
              r'^version = "([^"]+)"',
              Path("pyproject.toml").read_text(),
              re.MULTILINE,
          ).group(1)
          rust_version = re.search(
              r'^version = "([^"]+)"',
              Path("Cargo.toml").read_text(),
              re.MULTILINE,
          ).group(1)
          if {python_version, rust_version} != {expected}:
              print(
                  f"tag {tag} does not match Python {python_version} "
                  f"and Rust {rust_version}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Build Python wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Build Rust converter
        run: cargo build --workspace --release --locked

      - name: Package release artifacts
        run: |
          tar -czf "dist/adams-res-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            -C target/release adams-res
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)

      - name: Publish Gitea release
        uses: https://gitea.com/actions/gitea-release-action@5a83c90484ef4355121df5eb60558c8ce66e81ac
        with:
          tag_name: ${{ github.ref_name }}
          name: ChassisLab ${{ github.ref_name }}
          body: |
            ChassisLab ${{ github.ref_name }}.

            Includes Python wheel and Linux x86_64 `adams-res` binary.
          files: |
            dist/*
