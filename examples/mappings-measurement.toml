# Measurement signal mappings for every domain. Loaded by [mappings.measurement]
# in config.toml, so top-level keys here are domain names (svc, knc) — no
# "measurement" prefix needed, the pointer already scoped that. Measurement
# sources are flat names (DAQ channel, JSON key), so entries carry only
# `entity` + `unit`, no `component`. SVC entries map a canonical metric name
# to its reviewed-reference JSON key (identity here; rename `entity` to match
# a file using different key names). KnC `*_wheel_center_x/y/z` are required;
# every other KnC entry is optional — missing it just skips that curve.

[svc.front_left_mass_kg]
entity = "front_left_mass_kg"
unit = "kg"

[svc.front_right_mass_kg]
entity = "front_right_mass_kg"
unit = "kg"

[svc.rear_left_mass_kg]
entity = "rear_left_mass_kg"
unit = "kg"

[svc.rear_right_mass_kg]
