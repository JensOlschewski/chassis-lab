# This file is the [setup] table of config.toml
#
# [domain.*] applies to every domain test
# [domain.test.*] and apply to that test only and override [domain.*]
#
# Optional keys that are left out fall back to their default, and clab warns
# about each one (details with --verbose).

# KnC test condition, shown in the report footer
[knc.meta]
brakes_applied = false
engine_running = false
front_arb_connected = true
rear_arb_connected = true

# Plot range defined by wheel-center travel
[knc.window]
minimum_mm = -80
maximum_mm = 80
step_mm = 5
plot_branches = "all"     # all | selected (only the sweep used by the metrics)

# define where metric is calculated, and which sweep to use for the metric
# use --debug option for more details
[knc.metric]
gradient_points_mm = 10
direction = "rise"        # rise | fall | any
index = 1                 # nth sweep of that direction, 1-based

# The ADAMS results starts with a short settling rise before the full sweep
# Therefore use second index here!
[knc.metric.simulation]
index = 2

# Vertical test setup
# only keys that differ from [knc.*].
# [knc.vertical.window]
# minimum_mm = -0.8
# maximum_mm = 0.8
# plot_branches = "all"

# [knc.vertical.metric]
# gradient_points_mm = 0.2

# Roll test setup
# only keys that differ from [knc.*].
[knc.roll.meta]
brakes_applied = true

[knc.roll.metric]
gradient_points_deg = 0.5
