# This file is the [setup] table of config.toml
#
# [knc] applies to every KnC test
# [knc.<test>] applies to that test only and overrides [knc] key by key
# (tests: vertical, roll, longitudinal)
#
# Optional keys that are left out fall back to their default, and clab warns
# about each one (details with --verbose).

# Metrics are least-squares slopes over one full cycle: a falling branch and
# the rise after it. The sweep before the first fall is never part of a cycle.
[knc]
metric_cycle = 1          # nth full cycle, 1-based
plot_branches = "all"     # all | selected (only the cycle used by the metrics)

# Branch detection and edge trimming, optional (kernel defaults shown, no warning)
# reversal_min_fraction = 0.01    # a reversal shorter than this fraction of the span does not split a branch
# branch_min_fraction = 0.05      # measured branches shorter than this fraction of all samples are dropped
# edge_trim_width = 200           # samples searched at each sweep end
# edge_trim_percentile = 0.95     # curvature percentile above which the edge cut starts

# Fit window half-widths depend on the unit of each test, so set them per test.

# Vertical test: wheel-center travel in mm
[knc.vertical]
metric_window_mm = 10

# Roll test: travel in mm and roll angle in deg
[knc.roll]
metric_window_mm = 10
metric_window_deg = 2

# Longitudinal compliance: force in N
[knc.longitudinal]
metric_window_n = 1000
