# Input definitions.
# Assigns metadata-identified input data to each configured domain.
# Convert supported raw files with `clab convert` before analysis. Generated
# HDF5 output files below are intentionally not committed.
#
# SVC measurement data is not converted automatically and must be prepared
# separately.
# Signal names, source fields, and unit conversion are defined in mappings.toml.

[svc]
file = "input/generated-simulation-svc.h5"

[knc.vertical]
file = "input/generated-simulation-knc-vertical.h5"
