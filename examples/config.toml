# Example configuration.
#
# Each config role is stored in its own file.

[physics]
gravity = 9.80665 # m/s²

[setup]
# test definitions and their setup values.
file = "setup.toml"

[signals]
# signal mappings
# test-specific mappings extend or override them.
file = "mappings.toml"

[validation]
# validation definitions; `clab compare --tolerances` enables acceptance checks.
file = "tolerances.toml"
