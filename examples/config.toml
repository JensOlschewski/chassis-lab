# Example configuration.
#
# Each config role is stored in its own file.

[physics]
gravity = 9.80665 # m/s²

[setup]
file = "setup.toml"

[mappings.simulation.svc]
file = "mappings/mappings-simulation-svc.toml"

[mappings.simulation.knc]
file = "mappings/mappings-simulation-knc.toml"

[mappings.measurement.svc]
file = "mappings/mappings-measurement-svc.toml"

[mappings.measurement.knc]
file = "mappings/mappings-measurement-knc.toml"


[compare]
# Tolerances used for acceptance checks by `clab compare --tolerances`.
file = "tolerances.toml"
