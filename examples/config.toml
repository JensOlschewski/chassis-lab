# Example configuration.
#
# Each config role is stored in its own file.

[physics]
gravity = 9.80665 # m/s²

[setup]
# test definitions and their setup values.
file = "setup.toml"

[signals]
# signal mappings
# test-specific mappings can extend or override them.
file = "mappings.toml"

[compare]
# Tolerances used for acceptance checks by `clab compare --tolerances`.
file = "tolerances.toml"
