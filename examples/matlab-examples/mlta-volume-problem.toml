[models]
pwt = "mlta-volume-model-file-1e2.json"

[volumes]
rl_volume = "rl-bc-volume.hmascii"

[optimizer]
max_iterations = 100

[design]
HP_RL_X = [4256.4, 4296.4]
HP_RL_Y = [-618.85, -578.85]
HP_RL_Z = [276.38, 316.38]
HP_L_Z = [426.38, 446.38]
HP_L_X = [3935.2, 3955.2]
HP_L_Y = [-549.68, -529.68]

[signals]
v_wc = "pwt.characteristics.wheel_velocities.l_wc"
r_wcwp = "pwt.characteristics.wheel_points.l_wp -pwt.characteristics.wheel_points.l_wc"
omega_wca = "pwt.bodies.B2_Wheelcarrier.velocity.angular"
v_wp_proj = "cross(omega_wca, r_wcwp) + pwt.characteristics.wheel_velocities.l_wc"
epsilon = "rad2deg(atan(v_wc.x ./ v_wc.z))"
epsilon_ast = "rad2deg(atan(v_wp_proj.x ./ v_wp_proj.z))"
mid_idx = "round(numel(epsilon)/2)"

[objectives.epsilon_design]
value = "-epsilon(mid_idx)"

[objectives.epsilon_ast_design]
value = "-epsilon_ast(mid_idx)"

[constraints]
min_epsilon = "epsilon(mid_idx) >= 10"
max_epsilon = "epsilon(mid_idx) <= 15"
min_epsilon_ast = "epsilon_ast(mid_idx) >= 20"
max_epsilon_ast = "epsilon_ast(mid_idx) <= 30"
# RL starts 25.6 mm inside; ask for 28 mm so the start design violates it
inside_rl = "inside(rl_volume, pwt.bodies.B1_Link.points.RL.position(mid_idx)) >= 28"
