# Define acceptance tolerances for each signal
# use as
# clab compare --tolerances <tolerances.toml>
#
# - Absolute tolerances use the signal’s canonical unit.
# - Relative tolerances are percentages of the reference value.
# - If both are defined, validation uses the stricter tolerance.
#
# Signals without a tolerance are informational in `clab compare`

# SVC tolerances
[svc.validation.tolerances.absolute]
front_left_mass_kg = 0.01
front_right_mass_kg = 0.01
rear_left_mass_kg = 0.01
rear_right_mass_kg = 0.01
front_mass_kg = 0.01
rear_mass_kg = 0.01
total_mass_kg = 20.0
front_distribution_percent = 0.01
rear_distribution_percent = 0.01
wheelbase_mm = 0.01
front_track_mm = 0.01
rear_track_mm = 0.01
cg_x_from_front_axle_mm = 0.01
cg_height_mm = 1.0
ride_height_front_left_mm = 1.0
ride_height_front_right_mm = 1.0
ride_height_rear_left_mm = 1.0
ride_height_rear_right_mm = 1.0
toe_front_left_deg = 0.05
toe_front_right_deg = 0.05
toe_rear_left_deg = 0.05
toe_rear_right_deg = 0.05
camber_front_left_deg = 0.05
camber_front_right_deg = 0.05
camber_rear_left_deg = 0.05
camber_rear_right_deg = 0.05
inertia_xx_kg_mm2 = 500.0
inertia_yy_kg_mm2 = 1000.0
inertia_zz_kg_mm2 = 1000.0

[svc.validation.tolerances.relative_percent]
total_mass_kg = 1.0
wheelbase_mm = 0.5

