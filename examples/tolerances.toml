# tolerances.
# Define acceptance tolerances for each signal
# use as
# clab compare --tolerances <tolerances.toml>
#
# - Absolute tolerances use the signal’s canonical unit.
# - Relative tolerances are percentages of the reference value.
# - If both are defined, validation uses the stricter tolerance.
#
# Signals without a tolerance are informational in `clab compare`

# SVC tolerances
[svc.validation.tolerances.absolute]
front_left_mass_kg = 0.01
front_right_mass_kg = 0.01
rear_left_mass_kg = 0.01
rear_right_mass_kg = 0.01
front_mass_kg = 0.01
rear_mass_kg = 0.01
total_mass_kg = 20.0
front_distribution_percent = 0.01
rear_distribution_percent = 0.01
wheelbase_mm = 0.01
front_track_mm = 0.01
rear_track_mm = 0.01
cg_x_from_front_axle_mm = 0.01

[svc.validation.tolerances.relative_percent]
total_mass_kg = 1.0
wheelbase_mm = 0.5

# KnC vertical tolerances (example values)
# Metric names are <metric>_<corner>_<unit>
[knc.vertical.validation.tolerances.absolute]
bump_steer_front_left_deg_per_mm = 0.005
bump_steer_front_right_deg_per_mm = 0.005
bump_steer_rear_left_deg_per_mm = 0.005
bump_steer_rear_right_deg_per_mm = 0.005

bump_camber_front_left_deg_per_mm = 0.005
bump_camber_front_right_deg_per_mm = 0.005
bump_camber_rear_left_deg_per_mm = 0.005
bump_camber_rear_right_deg_per_mm = 0.005

wheel_recession_angle_front_left_deg = 0.5
wheel_recession_angle_front_right_deg = 0.5
wheel_recession_angle_rear_left_deg = 0.5
wheel_recession_angle_rear_right_deg = 0.5

suspension_rate_front_left_n_per_mm = 1.0
suspension_rate_front_right_n_per_mm = 1.0
suspension_rate_rear_left_n_per_mm = 1.0
suspension_rate_rear_right_n_per_mm = 1.0

ride_rate_front_left_n_per_mm = 1.0
ride_rate_front_right_n_per_mm = 1.0
ride_rate_rear_left_n_per_mm = 1.0
ride_rate_rear_right_n_per_mm = 1.0

tire_rate_front_left_n_per_mm = 10.0
tire_rate_front_right_n_per_mm = 10.0
tire_rate_rear_left_n_per_mm = 10.0
tire_rate_rear_right_n_per_mm = 10.0

[knc.vertical.validation.tolerances.relative_percent]
suspension_rate_front_left_n_per_mm = 5.0
suspension_rate_front_right_n_per_mm = 5.0
suspension_rate_rear_left_n_per_mm = 5.0
suspension_rate_rear_right_n_per_mm = 5.0

ride_rate_front_left_n_per_mm = 5.0
ride_rate_front_right_n_per_mm = 5.0
ride_rate_rear_left_n_per_mm = 5.0
ride_rate_rear_right_n_per_mm = 5.0

tire_rate_front_left_n_per_mm = 5.0
