# Run manifest. Input paths resolve relative to this file.
#
# Convert committed raw results first:
# clab convert input/example-simulation-svc.res -o input/generated-simulation-svc.h5
# clab convert input/example-simulation-knc-vertical.res -o input/generated-simulation-knc-vertical.h5
[meta]
name = "example-run"
loadcase = "example-loadcase"

[input.svc]
file = "input/generated-simulation-svc.h5"

[input.knc.vertical]
file = "input/generated-simulation-knc-vertical.h5"
