# Run manifest. Input paths resolve relative to this file.
#
# Convert committed raw results first:
# clab convert input/example-simulation-svc.res -d svc -o input/generated-simulation-svc.h5
# clab convert input/example-simulation-knc-vertical.res -d knc -t vertical -o input/generated-simulation-knc-vertical.h5

[meta]
name = "example_run_simulation"
loadcase = "example_loadcase"

[input.svc]
file = "input/generated-simulation-svc.h5"

[input.knc.vertical]
file = "input/generated-simulation-knc-vertical.h5"
