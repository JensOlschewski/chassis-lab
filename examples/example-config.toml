# Example configuration.
#
# Modular approach:
# Each config role is stored in its own file.

[meta]
name = "example-config"
loadcase = "example-loadcase"

[physics]
gravity = 9.80665 # m/s²

[input]
# Simulation and measurement sources (.res or .acd).
file = "example-input.toml"

[setup]
# test definitions and their setup values.
file = "example-setup.toml"

[signals]
# signal mappings; test-specific mappings extend or override them.
file = "example-signal-mappings.toml"

[validation]
# optional tolerance definition for `clab compare` acceptance checks.
file = "example-validation-tolerances.toml"
