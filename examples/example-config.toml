# Minimal, synthetic SVC configuration.
# Relative paths resolve from this file's directory.

[case]
name = "example-config"
variant = "EXAMPLE"
loadcase = "2UP"

[physics]
gravity = 9.80665 # m/s^2

[svc.inputs]
# Replace these example paths with converted simulation output and reviewed
# measurements from your own vehicle.
signal_map = "example-signals.toml"
simulation_json = "example-simulation-svc.json"
measurement_reference = "example-measurement-svc.json"

[svc.validation.tolerances.absolute]
# Keep only metrics relevant to your example or validation case.
front_left_mass_kg = 0.01
front_right_mass_kg = 0.01
rear_left_mass_kg = 0.01
rear_right_mass_kg = 0.01
front_mass_kg = 0.01
rear_mass_kg = 0.01
total_mass_kg = 20.0
front_distribution_percent = 0.01
rear_distribution_percent = 0.01
wheelbase_mm = 0.01
front_track_mm = 0.01
rear_track_mm = 0.01
cg_x_from_front_axle_mm = 0.01

[svc.validation.tolerances.relative_percent]
total_mass_kg = 1.0
wheelbase_mm = 0.5
