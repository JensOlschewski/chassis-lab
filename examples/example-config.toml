# Canonical function-first example configuration.
# Relative paths resolve from this file's directory.

[case]
name = "example-config"
domain = "knc"
loadcase = "2UP"

[physics]
gravity = 9.80665

[input.svc.simulation]
input_file = "example-simulation-svc.json"

[input.svc.measurement]
input_file = "example-measurement-svc.json"

# SVC mappings apply to SVC only.
[mappings.svc]
file = "example-signals.toml"

[input.knc.vertical.simulation]
input_file = "example-simulation-vertical.h5"

[input.knc.vertical.measurement]
input_file = "example-measurement-vertical.h5"

# KnC mappings are shared by all KnC tests. Test-specific values below add to
# or override this base using deep-merge precedence: shared < domain < test.
[mappings.knc]
file = "example-vertical-signals.toml"

[mappings.knc.vertical]
# Example child override; child-only mappings are also supported.
[mappings.knc.vertical.front_left_travel]
unit = "mm"

[setup.knc.vertical]
code = "example-vertical"
brakes_applied = false
engine_running = false
front_arb_connected = true
rear_arb_connected = true

[setup.knc.vertical.window]
minimum_mm = -1
maximum_mm = 1
step_mm = 1

# Tolerances are optional. Without them, SVC comparison is informational.
[validation.svc]
