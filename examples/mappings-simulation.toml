# SVC simulation signal mappings.
#
# Loaded by [mappings.simulation.svc] in config.toml, so this file is already
# scoped to "svc, simulation" — canonical names sit at the top level, no
# domain/source_kind prefix needed.
#
# Run `clab inspect --mapping svc` to list every canonical SVC signal.

[svc.front_left_wheel_load]
entity = "example.wheel_loads"
component = "front_left"
unit = "newton"

[svc.front_right_wheel_load]
entity = "example.wheel_loads"
component = "front_right"
unit = "newton"

[svc.rear_left_wheel_load]
entity = "example.wheel_loads"
component = "rear_left"
unit = "newton"

[svc.rear_right_wheel_load]
entity = "example.wheel_loads"
component = "rear_right"
unit = "newton"

[svc.wheelbase]
entity = "example.geometry"
component = "wheelbase"
unit = "mm"

[svc.front_left_ride_height]
entity = "example.ride_heights"
component = "front_left"
unit = "mm"

[svc.front_right_ride_height]
entity = "example.ride_heights"
component = "front_right"
unit = "mm"

[svc.rear_left_ride_height]
entity = "example.ride_heights"
component = "rear_left"
unit = "mm"

[svc.rear_right_ride_height]
entity = "example.ride_heights"
component = "rear_right"
unit = "mm"

[svc.front_track]
entity = "example.geometry"
component = "front_track"
unit = "mm"

[svc.rear_track]
entity = "example.geometry"
component = "rear_track"
unit = "mm"

[svc.cg_height]
entity = "example.geometry"
component = "cg_height"
unit = "mm"

[svc.inertia_xx]
entity = "example.geometry"
component = "inertia_xx"
unit = "kg*mm^2"

[svc.inertia_yy]
entity = "example.geometry"
component = "inertia_yy"
unit = "kg*mm^2"

[svc.inertia_zz]
entity = "example.geometry"
component = "inertia_zz"
unit = "kg*mm^2"

[svc.front_left_wheel_center_x]
entity = "example.geometry"
component = "front_left_wheel_center_x"
unit = "mm"

[svc.gyro_x]
entity = "example.geometry"
component = "gyro_x"
unit = "mm"

[svc.front_left_toe]
entity = "example.toe_camber"
component = "front_left_toe"
unit = "deg"

[svc.front_right_toe]
entity = "example.toe_camber"
component = "front_right_toe"
unit = "deg"

[svc.rear_left_toe]
entity = "example.toe_camber"
component = "rear_left_toe"
unit = "deg"

[svc.rear_right_toe]
entity = "example.toe_camber"
component = "rear_right_toe"
unit = "deg"

[svc.front_left_camber]
entity = "example.toe_camber"
component = "front_left_camber"
unit = "deg"

[svc.front_right_camber]
entity = "example.toe_camber"
component = "front_right_camber"
unit = "deg"

[svc.rear_left_camber]
entity = "example.toe_camber"
component = "rear_left_camber"
unit = "deg"

[svc.rear_right_camber]
entity = "example.toe_camber"
component = "rear_right_camber"
unit = "deg"


