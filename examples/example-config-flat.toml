# Flat example configuration.
#
# Single-file approach:
# Every section is inline. Paths are relative to this file.
# Convert raw .res/.acd files before validation when converted artifacts are
# not already available.

[meta]
name = "example-config"
loadcase = "example-loadcase"

[physics]
gravity = 9.80665 # m/s²

[input.svc.simulation]
file = "input/example-simulation-svc.json"

[input.svc.measurement]
file = "input/example-measurement-svc.json"

[input.knc.vertical.simulation]
file = "input/example-simulation-vertical.h5"

[input.knc.vertical.measurement]
file = "input/example-measurement-vertical.h5"

[setup.knc.vertical]
code = "example-vertical"
brakes_applied = false
engine_running = false
front_arb_connected = true
rear_arb_connected = true

[setup.knc.vertical.window]
minimum_mm = -1
maximum_mm = 1
step_mm = 1

[signals.svc.signals.front_left_wheel_load]
entity = "example.wheel_loads"
component = "front_left"
unit = "newton"

[signals.svc.signals.front_right_wheel_load]
entity = "example.wheel_loads"
component = "front_right"
unit = "newton"

[signals.svc.signals.rear_left_wheel_load]
entity = "example.wheel_loads"
component = "rear_left"
unit = "newton"

[signals.svc.signals.rear_right_wheel_load]
entity = "example.wheel_loads"
component = "rear_right"
unit = "newton"

[signals.svc.signals.wheelbase]
entity = "example.geometry"
component = "wheelbase"
unit = "mm"

[signals.svc.signals.front_left_ride_height]
entity = "example.ride_heights"
component = "front_left"
unit = "mm"

[signals.svc.signals.front_right_ride_height]
entity = "example.ride_heights"
component = "front_right"
unit = "mm"

[signals.svc.signals.rear_left_ride_height]
entity = "example.ride_heights"
component = "rear_left"
unit = "mm"

[signals.svc.signals.rear_right_ride_height]
entity = "example.ride_heights"
component = "rear_right"
unit = "mm"

[signals.svc.signals.front_track]
entity = "example.geometry"
component = "front_track"
unit = "mm"

[signals.svc.signals.rear_track]
entity = "example.geometry"
component = "rear_track"
unit = "mm"

[signals.svc.signals.cg_height]
entity = "example.geometry"
component = "cg_height"
unit = "mm"

[signals.svc.signals.inertia_xx]
entity = "example.geometry"
component = "inertia_xx"
unit = "kg*mm^2"

[signals.svc.signals.inertia_yy]
entity = "example.geometry"
component = "inertia_yy"
unit = "kg*mm^2"

[signals.svc.signals.inertia_zz]
entity = "example.geometry"
component = "inertia_zz"
unit = "kg*mm^2"

[signals.svc.signals.front_left_wheel_center_x]
entity = "example.geometry"
component = "front_left_wheel_center_x"
unit = "mm"

[signals.svc.signals.gyro_x]
entity = "example.geometry"
component = "gyro_x"
unit = "mm"

# SVC toe and camber.
[signals.svc.signals.front_left_toe]
entity = "example.toe_camber"
component = "front_left_toe"
unit = "deg"

[signals.svc.signals.front_right_toe]
entity = "example.toe_camber"
component = "front_right_toe"
unit = "deg"

[signals.svc.signals.rear_left_toe]
