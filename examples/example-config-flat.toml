[validation.svc.validation.tolerances.absolute]
front_left_mass_kg = 0.01
front_right_mass_kg = 0.01
rear_left_mass_kg = 0.01
rear_right_mass_kg = 0.01
front_mass_kg = 0.01
rear_mass_kg = 0.01
total_mass_kg = 20.0
front_distribution_percent = 0.01
rear_distribution_percent = 0.01
wheelbase_mm = 0.01
front_track_mm = 0.01
rear_track_mm = 0.01
cg_x_from_front_axle_mm = 0.01

[validation.svc.validation.tolerances.relative_percent]
