# Signal mappings.
# Each entry maps one canonical signal understood by the program (the table name)
# to a signal in the raw input file (`entity` + `component`) and declares its
# unit which is converted if necessary by the program!
#
# Example
# Run `clab inspect --mapping svc` to list available canonical SVC signals.
# Run `clab inspect --mapping svc --template` for an empty generated TOML template.
#
# clab inspect --mapping svc
# SVC
#   front_left_wheel_load       N
#   front_right_wheel_load      N
#   rear_left_wheel_load        N
#   rear_right_wheel_load       N
#   wheelbase                   mm
#   ...

# SVC signal mappings.

[svc.signals.front_left_wheel_load]
entity = "example.wheel_loads"
component = "front_left"
unit = "newton"

[svc.signals.front_right_wheel_load]
entity = "example.wheel_loads"
component = "front_right"
unit = "newton"

[svc.signals.rear_left_wheel_load]
entity = "example.wheel_loads"
component = "rear_left"
unit = "newton"

[svc.signals.rear_right_wheel_load]
entity = "example.wheel_loads"
component = "rear_right"
unit = "newton"

[svc.signals.wheelbase]
entity = "example.geometry"
component = "wheelbase"
unit = "mm"

