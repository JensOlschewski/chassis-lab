# Combined synthetic SVC and vertical fixture configuration.
# Relative paths resolve from this file's directory.

[case]
name = "example-config"
variant = "EXAMPLE"
loadcase = "2UP"

[physics]
gravity = 9.80665

[svc.inputs]
simulation_hdf5 = "svc.simulation.h5"
signal_map = "example-signals.toml"
measurement_reference = "example-measures.json"

[svc.validation.tolerances.absolute]
front_left_mass_kg = 0.01
front_right_mass_kg = 0.01
rear_left_mass_kg = 0.01
rear_right_mass_kg = 0.01
front_mass_kg = 0.01
rear_mass_kg = 0.01
total_mass_kg = 20.0
front_distribution_percent = 0.01
rear_distribution_percent = 0.01
wheelbase_mm = 0.01
front_track_mm = 0.01
rear_track_mm = 0.01
cg_x_from_front_axle_mm = 0.01

[svc.validation.tolerances.relative_percent]
total_mass_kg = 1.0
wheelbase_mm = 0.5

[vertical.inputs]
measurement_hdf5 = "vertical.measurement.h5"
simulation_hdf5 = "vertical.simulation.h5"

[vertical.setup]
code = "vert-smoke"
brakes_applied = false
engine_running = false
front_arb_connected = true
rear_arb_connected = true

[vertical.window]
minimum_mm = -1
maximum_mm = 1
step_mm = 1

[vertical.signals.front_left_travel]
entity = "front_left"
component = "travel"
unit = "mm"

[vertical.signals.front_left_wheel_center_x]
entity = "front_left"
component = "x"
unit = "mm"

[vertical.signals.front_left_wheel_center_y]
entity = "front_left"
component = "y"
unit = "mm"

[vertical.signals.front_left_wheel_center_z]
entity = "front_left"
component = "z"
unit = "mm"

[vertical.signals.front_right_travel]
entity = "front_right"
component = "travel"
unit = "mm"

[vertical.signals.front_right_wheel_center_x]
entity = "front_right"
component = "x"
unit = "mm"

[vertical.signals.front_right_wheel_center_y]
entity = "front_right"
component = "y"
unit = "mm"

[vertical.signals.front_right_wheel_center_z]
entity = "front_right"
component = "z"
unit = "mm"

[vertical.signals.rear_left_travel]
entity = "rear_left"
component = "travel"
unit = "mm"

[vertical.signals.rear_left_wheel_center_x]
entity = "rear_left"
component = "x"
unit = "mm"

[vertical.signals.rear_left_wheel_center_y]
entity = "rear_left"
component = "y"
unit = "mm"

[vertical.signals.rear_left_wheel_center_z]
entity = "rear_left"
component = "z"
unit = "mm"

[vertical.signals.rear_right_travel]
entity = "rear_right"
component = "travel"
unit = "mm"

[vertical.signals.rear_right_wheel_center_x]
entity = "rear_right"
component = "x"
unit = "mm"

[vertical.signals.rear_right_wheel_center_y]
entity = "rear_right"
component = "y"
unit = "mm"

[vertical.signals.rear_right_wheel_center_z]
entity = "rear_right"
component = "z"
unit = "mm"
