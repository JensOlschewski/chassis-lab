# Validation tolerances.
# Define acceptance tolerances for each signal.
#
# - Absolute tolerances use the signal’s canonical unit.
# - Relative tolerances are percentages of the reference value.
# - If both are defined, validation uses the stricter tolerance.
#
# Signals without a tolerance are informational in `clab compare`

# SVC tolerances.

[svc.validation.tolerances.absolute]
front_left_mass_kg = 0.01
front_right_mass_kg = 0.01
rear_left_mass_kg = 0.01
rear_right_mass_kg = 0.01
front_mass_kg = 0.01
rear_mass_kg = 0.01
total_mass_kg = 20.0
front_distribution_percent = 0.01
rear_distribution_percent = 0.01
wheelbase_mm = 0.01
front_track_mm = 0.01
rear_track_mm = 0.01
cg_x_from_front_axle_mm = 0.01

[svc.validation.tolerances.relative_percent]
total_mass_kg = 1.0
wheelbase_mm = 0.5

# KnC vertical tolerances.

[knc.vertical.validation.tolerances.absolute]
front_left_wheel_center_x_mm = 0.1
front_left_wheel_center_y_mm = 0.1
front_left_wheel_center_z_mm = 0.1
front_right_wheel_center_x_mm = 0.1
front_right_wheel_center_y_mm = 0.1
front_right_wheel_center_z_mm = 0.1
rear_left_wheel_center_x_mm = 0.1
rear_left_wheel_center_y_mm = 0.1
rear_left_wheel_center_z_mm = 0.1
rear_right_wheel_center_x_mm = 0.1
rear_right_wheel_center_y_mm = 0.1
rear_right_wheel_center_z_mm = 0.1

[knc.vertical.validation.tolerances.relative_percent]
front_right_wheel_center_x_mm = 0.2
front_right_wheel_center_y_mm = 0.2
front_right_wheel_center_z_mm = 0.2
rear_left_wheel_center_x_mm = 0.2
rear_left_wheel_center_y_mm = 0.2
rear_left_wheel_center_z_mm = 0.2
rear_right_wheel_center_x_mm = 0.2
rear_right_wheel_center_y_mm = 0.2
rear_right_wheel_center_z_mm = 0.2
