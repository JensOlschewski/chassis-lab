[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chassis-lab"
version = "0.5.1"
description = "Analyze and validate vehicle multibody simulation results"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.11,<4",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chassis_lab"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
